name: Deploy to Production

on:
  push:
    branches:
      - main
      - frontend-work
      - claude/code-review-feedback-YAe51
      - claude/find-uncommitted-changes-6sZ5T

jobs:
  deploy:
    name: Deploy to app.travelautorental.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: app.travelautorental.com
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ec2-user/projects/mrst

            echo "📥 Pulling latest code..."
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            echo "📦 Installing dependencies..."
            export PNPM_HOME="/home/ec2-user/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"
            pnpm install --frozen-lockfile

            echo "🏗️ Building..."
            # Clear Next.js cache to ensure fresh build
            rm -rf apps/web/.next
            pnpm build

            echo "🗄️ Running database migrations..."
            # Load DATABASE_URL from .env if exists, or use default
            if [ -f ".env" ]; then
              export $(cat .env | grep DATABASE_URL | xargs)
            elif [ -f ".env.local" ]; then
              export $(cat .env.local | grep DATABASE_URL | xargs)
            else
              # Fallback: extract from ecosystem.config.js
              export DATABASE_URL=$(node -e "const config = require('./ecosystem.config.js'); console.log(config.apps[0].env.DATABASE_URL || config.apps[1].env.DATABASE_URL);")
            fi

            echo "Database URL configured: ${DATABASE_URL:0:20}..."

            # Check if there are new migration files and run them
            if [ -d "packages/db/src/migrations" ]; then
              for migration in packages/db/src/migrations/*.sql; do
                if [ -f "$migration" ]; then
                  echo "  Running migration: $(basename $migration)"
                  psql "$DATABASE_URL" -f "$migration" 2>&1 || echo "  (Migration may have already been applied)"
                fi
              done
            fi

            echo "🔄 Syncing fleet vehicles..."
            # Re-sync fleet vehicles to apply is_fleet_vehicle flag
            DATABASE_URL="$DATABASE_URL" npx tsx packages/integrations/src/hq/run-extended-sync.ts || echo "⚠️ Sync failed, continuing with deployment"

            echo "🔄 Restarting services..."
            pm2 delete mrst-api || true
            pm2 delete mrst-web || true
            pm2 start ecosystem.config.js

            echo "📊 Service status:"
            pm2 list | grep mrst

            echo ""
            echo "✅ Deployment complete!"
            echo "🔗 App: https://app.travelautorental.com/mrst/customers"

      - name: Deployment notification
        if: success()
        run: |
          echo "✅ Successfully deployed ${{ github.ref_name }} to production"
          echo "🔗 https://app.travelautorental.com/mrst/"

      - name: Deployment failed
        if: failure()
        run: |
          echo "❌ Deployment failed for ${{ github.ref_name }}"
          exit 1
